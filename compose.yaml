name: lurewake

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: lurewake
      POSTGRES_USER: lurewake
      POSTGRES_PASSWORD: ${LUREWAKE_DB_PASSWORD:?Database password required}

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - lurewake_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  lurewake_pgdata:
